<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل مدیریت AmneziaWG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-screen" class="screen">
  <div class="login-box">
    <h1>ورود به پنل</h1>
    <input id="login-username" placeholder="نام کاربری" autocomplete="username">
    <input id="login-password" type="password" placeholder="رمز عبور" autocomplete="current-password">
    <button onclick="doLogin()">ورود</button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <header>
    <h1>پنل مدیریت AmneziaWG</h1>
    <div class="summary" id="summary"></div>
    <button class="btn-secondary" onclick="logout()">خروج</button>
  </header>

  <main>
    <div class="toolbar">
      <button class="btn-primary" onclick="openCreateModal()">+ افزودن کاربر</button>
      <button class="btn-secondary" onclick="loadPeers()">بروزرسانی</button>
    </div>

    <table id="peers-table">
      <thead>
        <tr>
          <th>وضعیت</th>
          <th>نام</th>
          <th>IP</th>
          <th>مصرف</th>
          <th>سقف مصرف</th>
          <th>انقضا</th>
          <th>عملیات</th>
        </tr>
      </thead>
      <tbody id="peers-body"></tbody>
    </table>
  </main>
</div>

<div id="create-modal" class="modal hidden">
  <div class="modal-box">
    <h2>افزودن کاربر جدید</h2>
    <input id="new-name" placeholder="نام کاربر">
    <input id="new-note" placeholder="یادداشت (اختیاری)">
    <label>سقف مصرف (گیگابایت، خالی = نامحدود)</label>
    <input id="new-limit" type="number" step="0.1" placeholder="مثلا 50">
    <label>تاریخ انقضا (روز از الان، خالی = نامحدود)</label>
    <input id="new-expire-days" type="number" placeholder="مثلا 30">
    <div class="modal-actions">
      <button class="btn-primary" onclick="submitCreate()">ایجاد</button>
      <button class="btn-secondary" onclick="closeModal('create-modal')">انصراف</button>
    </div>
  </div>
</div>

<div id="config-modal" class="modal hidden">
  <div class="modal-box">
    <h2>کانفیگ کاربر</h2>
    <img id="config-qr" style="width:220px;height:220px;display:block;margin:0 auto 12px;">
    <textarea id="config-text" readonly rows="14"></textarea>
    <div class="modal-actions">
      <button class="btn-primary" onclick="downloadConfig()">دانلود فایل کانفیگ</button>
      <button class="btn-secondary" onclick="closeModal('config-modal')">بستن</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
